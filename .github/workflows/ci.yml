name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Install and smoke test local package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/backburner-local"
          outputs="${RUNNER_TEMP}/backburner-local-outputs"
          npm run install:local -- --prefix "$prefix"
          "$prefix/bin/backburner" journal --outputs-dir "$outputs" --last 1 --json

      - name: Install and smoke test local package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:RUNNER_TEMP "backburner-local"
          $outputs = Join-Path $env:RUNNER_TEMP "backburner-local-outputs"
          npm run install:local -- --prefix $prefix
          & (Join-Path $prefix "backburner.cmd") journal --outputs-dir $outputs --last 1 --json
